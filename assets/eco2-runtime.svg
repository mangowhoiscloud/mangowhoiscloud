<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Eco2 agent and cloud runtime</title><desc id="desc">A production-oriented AI service runtime connecting APIs, LangGraph multi-agent orchestration, tools and data, streaming, observability, and Kubernetes infrastructure.</desc>
<defs><style>.bg{fill:#0d1117}.box{fill:#161b22;stroke:#30363d;stroke-width:2}.t{fill:#f0f6fc;font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.s{fill:#8b949e;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.m{fill:#c9d1d9;font:600 17px ui-monospace,SFMono-Regular,Consolas,monospace}.line{stroke:#8b949e;stroke-width:2;fill:none}.dash{stroke:#6e7681;stroke-width:2;stroke-dasharray:8 7;fill:none}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs>
<rect class="bg" width="1200" height="610" rx="18"/><text class="t" x="54" y="55">Eco2 runtime</text><text class="s" x="54" y="82">multi-agent application flow on a self-managed cloud platform</text>
<rect class="box" x="55" y="130" width="170" height="90" rx="12"/><text class="t" x="99" y="166">Client</text><text class="s" x="80" y="195">web / mobile</text>
<rect class="box" x="275" y="130" width="190" height="90" rx="12"/><text class="t" x="318" y="166">API edge</text><text class="s" x="300" y="195">auth + routing</text>
<rect class="box" x="515" y="115" width="270" height="120" rx="12"/><text class="t" x="556" y="153">Agent workflow</text><text class="s" x="548" y="183">LangGraph parallel paths</text><text class="s" x="548" y="207">tool use + shared pipeline</text>
<rect class="box" x="835" y="115" width="310" height="120" rx="12"/><text class="t" x="883" y="153">Models and data</text><text class="s" x="866" y="183">vision, RAG, regulations</text><text class="s" x="866" y="207">external tools and services</text>
<path class="line" marker-end="url(#a)" d="M225 175H275"/><path class="line" marker-end="url(#a)" d="M465 175H515"/><path class="line" marker-end="url(#a)" d="M785 175H835"/>
<rect class="box" x="275" y="285" width="190" height="90" rx="12"/><text class="t" x="326" y="321">Stream</text><text class="s" x="315" y="350">SSE responses</text><path class="line" marker-end="url(#a)" d="M650 235V270H370V285"/><path class="line" marker-end="url(#a)" d="M275 330H140V220"/>
<rect class="box" x="515" y="285" width="270" height="90" rx="12"/><text class="t" x="557" y="321">Observability</text><text class="s" x="546" y="350">EFK, OTel, LangSmith</text><path class="dash" marker-end="url(#a)" d="M650 235V285"/>
<rect class="box" x="55" y="435" width="1090" height="115" rx="14"/><text class="m" x="82" y="470">CLOUD PLATFORM</text><text class="t" x="82" y="510">24-node Kubernetes</text><text class="s" x="300" y="510">Terraform + Ansible</text><text class="s" x="520" y="510">ArgoCD GitOps</text><text class="s" x="700" y="510">service scaling and operations</text><path class="dash" marker-end="url(#a)" d="M650 435V375"/><path class="dash" marker-end="url(#a)" d="M370 435V375"/>
