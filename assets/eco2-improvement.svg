<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="eco2-improvement-title eco2-improvement-desc">
<title id="eco2-improvement-title">Eco² / Turn a failure into a testable change</title>
<desc id="eco2-improvement-desc">Responsibility lanes separate reproduction and observation, human/coding-agent diagnosis and changes, and CI/delivery. A reviewed, checked revision reaches Kubernetes through Git and ArgoCD. Repeating the workload produces new evidence. The human owns the final decision, not the telemetry system or production runtime.</desc>
<defs>
    <style>
      :root{color-scheme:light dark;--paper:#fafbfc;--surface:#f0f2f5;--node:#fff;--ink:#1f2733;--muted:#515d6e;--rule:#bec6d0;--accent:#b84e23;--tint:#fff4ee}
      @media(prefers-color-scheme:dark){:root{--paper:#0d1117;--surface:#161c25;--node:#111821;--ink:#e6edf3;--muted:#a5b1c2;--rule:#465266;--accent:#f09c72;--tint:#281d19}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
      .title{font-size:32px;font-weight:700;letter-spacing:-.6px}.name{font-size:24px;font-weight:650;letter-spacing:-.3px}.body{font-size:20px}.small{font-size:16px;fill:var(--muted)}.muted{fill:var(--muted)}
      .mono{font:16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:var(--muted)}.section{font-size:16px;font-weight:650;fill:var(--muted)}
      .boundary{fill:none;stroke:var(--rule);stroke-width:1.5}.node{fill:var(--node);stroke:var(--rule);stroke-width:1.2}.zone{fill:var(--surface)}.focus{fill:var(--tint);stroke:var(--accent);stroke-width:1.5}
      .flow{fill:none;stroke:var(--ink);stroke-width:2;marker-end:url(#eco2-improvement-arrow)}.control{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#eco2-improvement-arrow-control)}.observe{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 5;marker-end:url(#eco2-improvement-arrow-control)}
      .mask{fill:var(--paper)}
    </style>
    <marker id="eco2-improvement-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--ink)"/></marker>
    <marker id="eco2-improvement-arrow-control" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--muted)"/></marker>
    <marker id="eco2-improvement-arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
  </defs>
<rect width="1280" height="920" fill="var(--paper)"/>
<text x="32" y="48" class="title" text-anchor="start">Eco² / Turn a failure into a testable change</text>
<text x="32" y="84" class="body muted" text-anchor="start">The same workload connects a bottleneck hypothesis to the decision to keep, revise or revert.</text>
<rect x="32" y="152" width="352" height="668" rx="4" class="zone"/><rect x="456" y="152" width="352" height="668" rx="4" class="zone"/><rect x="880" y="152" width="368" height="668" rx="4" class="zone"/>
<path d="M360 284H480" class="flow"/><path d="M632 340V448" class="flow"/><path d="M784 504H904" class="flow"/><path d="M1064 560V672" class="flow"/><path d="M904 732H844V612H208V672" class="flow"/><path d="M360 732H480" class="flow"/><path d="M632 792V832H416V504H480" class="control"/>
<text x="56" y="188" class="section" text-anchor="start">REPRODUCE / MEASURE</text><text x="480" y="188" class="section" text-anchor="start">HUMAN + CODING AGENT</text><text x="904" y="188" class="section" text-anchor="start">CI / DELIVERY</text><rect x="56" y="228" width="304" height="112" rx="4" class="node"/><text x="76" y="264" class="name" text-anchor="start">Reproduce failure</text><text x="76" y="296" class="body" text-anchor="start">Workload + pressure</text><text x="76" y="324" class="body" text-anchor="start">Metrics · logs · traces</text><rect x="480" y="228" width="304" height="112" rx="4" class="node"/><text x="500" y="264" class="name" text-anchor="start">Bottleneck hypothesis</text><text x="500" y="296" class="body" text-anchor="start">Falsifiable explanation</text><text x="500" y="324" class="body" text-anchor="start">Expected signal change</text><rect x="480" y="448" width="304" height="112" rx="4" class="node"/><text x="500" y="484" class="name" text-anchor="start">Small diff + contract</text><text x="500" y="516" class="body" text-anchor="start">Code / manifest change</text><text x="500" y="544" class="body" text-anchor="start">A check for recurrence</text><rect x="904" y="448" width="320" height="112" rx="4" class="node"/><text x="924" y="484" class="name" text-anchor="start">Accepted revision</text><text x="924" y="516" class="body" text-anchor="start">CI checks + review</text><text x="924" y="544" class="body" text-anchor="start">Git → ArgoCD</text><rect x="904" y="672" width="320" height="120" rx="4" class="node"/><text x="924" y="708" class="name" text-anchor="start">Kubernetes</text><text x="924" y="740" class="body" text-anchor="start">Reconcile desired state</text><text x="924" y="768" class="body" text-anchor="start">Rerun the workload</text><rect x="56" y="672" width="304" height="120" rx="4" class="node"/><text x="76" y="708" class="name" text-anchor="start">Same workload</text><text x="76" y="740" class="body" text-anchor="start">Measure the same signals</text><text x="76" y="768" class="body" text-anchor="start">New evidence</text><rect x="480" y="672" width="304" height="120" rx="4" class="focus"/><text x="500" y="708" class="name" text-anchor="start">Human verdict</text><text x="500" y="740" class="body" text-anchor="start">Keep / revise / revert</text><text x="500" y="768" class="body" text-anchor="start">Compare before and after</text><rect x="600" y="592" width="240" height="28" rx="4" class="mask"/><text x="720" y="612" class="small" text-anchor="middle">repeat under the change</text><text x="56" y="448" class="name" text-anchor="start">A failure becomes</text><text x="56" y="480" class="name" text-anchor="start">a testable contract.</text><text x="56" y="528" class="small" text-anchor="start">ACK / recovery / probe behavior</text><text x="904" y="268" class="body" text-anchor="start">Checks admit a revision.</text><text x="904" y="304" class="body" text-anchor="start">They do not prove the fix.</text><rect x="316" y="812" width="200" height="28" rx="4" class="mask"/><text x="416" y="832" class="small" text-anchor="middle">revise the contract</text>
<path d="M32 856H1248" stroke="var(--rule)"/>
<text x="32" y="892" class="small" text-anchor="start">External engineering process, not runtime self-modification. The developer-written case table below supplies the evidence.</text>
</svg>
