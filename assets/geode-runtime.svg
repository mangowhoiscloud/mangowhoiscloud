<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="784" viewBox="0 0 1280 784" role="img" aria-labelledby="geode-runtime-title geode-runtime-desc">
<title id="geode-runtime-title">GEODE / One execution, distinct records</title>
<desc id="geode-runtime-desc">Time runs downward across User, AgenticLoop, Tool/environment and Verifier lifelines. The loop calls tools and receives observations or errors. Contract-required verification returns a verdict and evidence. The final result and execution trace return to the user.</desc>
<defs>
    <style>
      :root{color-scheme:light dark;--paper:#fafbfc;--surface:#f0f2f5;--node:#fff;--ink:#1f2733;--muted:#515d6e;--rule:#bec6d0;--accent:#b84e23;--tint:#fff4ee}
      @media(prefers-color-scheme:dark){:root{--paper:#0d1117;--surface:#161c25;--node:#111821;--ink:#e6edf3;--muted:#a5b1c2;--rule:#465266;--accent:#f09c72;--tint:#281d19}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
      .title{font-size:32px;font-weight:700;letter-spacing:-.6px}.name{font-size:24px;font-weight:650;letter-spacing:-.3px}.body{font-size:20px}.small{font-size:16px;fill:var(--muted)}.muted{fill:var(--muted)}
      .mono{font:16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:var(--muted)}.section{font-size:16px;font-weight:650;fill:var(--muted)}
      .boundary{fill:none;stroke:var(--rule);stroke-width:1.5}.node{fill:var(--node);stroke:var(--rule);stroke-width:1.2}.zone{fill:var(--surface)}.focus{fill:var(--tint);stroke:var(--accent);stroke-width:1.5}
      .flow{fill:none;stroke:var(--ink);stroke-width:2;marker-end:url(#geode-runtime-arrow)}.control{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#geode-runtime-arrow-control)}.observe{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 5;marker-end:url(#geode-runtime-arrow-control)}
      .mask{fill:var(--paper)}
    </style>
    <marker id="geode-runtime-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--ink)"/></marker>
    <marker id="geode-runtime-arrow-control" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--muted)"/></marker>
    <marker id="geode-runtime-arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
  </defs>
<rect width="1280" height="784" fill="var(--paper)"/>
<text x="32" y="48" class="title" text-anchor="start">GEODE / One execution, distinct records</text>
<text x="32" y="84" class="body muted" text-anchor="start">Context assembly and compaction belong to the runtime; verification follows the run contract.</text>
<rect x="268" y="332" width="980" height="288" rx="4" class="boundary"/><rect x="380" y="480" width="844" height="124" rx="4" class="zone"/>
<path d="M124 228V704" fill="none" stroke="var(--rule)" stroke-dasharray="6 6"/><path d="M432 228V704" fill="none" stroke="var(--rule)" stroke-dasharray="6 6"/><path d="M808 228V704" fill="none" stroke="var(--rule)" stroke-dasharray="6 6"/><path d="M1136 228V704" fill="none" stroke="var(--rule)" stroke-dasharray="6 6"/><rect x="428" y="284" width="8" height="400" rx="4" class="zone"/><rect x="804" y="396" width="8" height="56" rx="4" class="zone"/><rect x="1132" y="536" width="8" height="48" rx="4" class="zone"/><path d="M124 284H428" class="flow"/><path d="M436 396H804" class="flow"/><path d="M804 452H436" class="control"/><path d="M436 536H1132" class="flow"/><path d="M1132 584H436" class="control"/><path d="M428 684H124" class="control"/>
<rect x="32" y="152" width="184" height="76" rx="4" class="node"/><text x="52" y="188" class="name" text-anchor="start">User</text><rect x="292" y="152" width="280" height="76" rx="4" class="node"/><text x="312" y="188" class="name" text-anchor="start">AgenticLoop</text><rect x="680" y="152" width="256" height="76" rx="4" class="node"/><text x="700" y="188" class="name" text-anchor="start">Tool / environment</text><rect x="1024" y="152" width="224" height="76" rx="4" class="node"/><text x="1044" y="188" class="name" text-anchor="start">Verifier</text><rect x="136" y="252" width="272" height="28" rx="4" class="mask"/><text x="272" y="272" class="small" text-anchor="middle">goal + session state</text><text x="288" y="356" class="section" text-anchor="start">REPEAT / until completion or a stopping condition</text><rect x="536" y="364" width="160" height="28" rx="4" class="mask"/><text x="616" y="384" class="small" text-anchor="middle">tool call</text><rect x="492" y="420" width="248" height="28" rx="4" class="mask"/><text x="616" y="440" class="small" text-anchor="middle">observation / error</text><text x="396" y="504" class="section" text-anchor="start">ONLY WHEN REQUIRED BY THE RUN CONTRACT</text><rect x="692" y="504" width="184" height="28" rx="4" class="mask"/><text x="784" y="524" class="small" text-anchor="middle">candidate result</text><rect x="668" y="552" width="232" height="28" rx="4" class="mask"/><text x="784" y="572" class="small" text-anchor="middle">verdict + evidence</text><rect x="136" y="652" width="272" height="28" rx="4" class="mask"/><text x="272" y="672" class="small" text-anchor="middle">result + execution trace</text>
<path d="M32 720H1248" stroke="var(--rule)"/>
<text x="32" y="756" class="small" text-anchor="start">Completion statement ≠ verifier verdict ≠ termination reason. Solid: call. Dashed: response.</text>
</svg>
