<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="912" viewBox="0 0 1280 912" role="img" aria-labelledby="harbor-rollout-title harbor-rollout-desc">
<title id="harbor-rollout-title">Harbor / Independent trials, traceable evidence</title>
<desc id="harbor-rollout-desc">The frozen run spec controls Harbor. GEODE and native Codex use independent containers and separate task-verifier runs. Raw actions and verifier outputs remain private; normalization, selection, hash and privacy checks admit public derivatives. Replay is derived evidence, not a replacement for result authority.</desc>
<defs>
    <style>
      :root{color-scheme:light dark;--paper:#fafbfc;--surface:#f0f2f5;--node:#fff;--ink:#1f2733;--muted:#515d6e;--rule:#bec6d0;--accent:#b84e23;--tint:#fff4ee}
      @media(prefers-color-scheme:dark){:root{--paper:#0d1117;--surface:#161c25;--node:#111821;--ink:#e6edf3;--muted:#a5b1c2;--rule:#465266;--accent:#f09c72;--tint:#281d19}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
      .title{font-size:32px;font-weight:700;letter-spacing:-.6px}.name{font-size:24px;font-weight:650;letter-spacing:-.3px}.body{font-size:20px}.small{font-size:16px;fill:var(--muted)}.muted{fill:var(--muted)}
      .mono{font:16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:var(--muted)}.section{font-size:16px;font-weight:650;fill:var(--muted)}
      .boundary{fill:none;stroke:var(--rule);stroke-width:1.5}.node{fill:var(--node);stroke:var(--rule);stroke-width:1.2}.zone{fill:var(--surface)}.focus{fill:var(--tint);stroke:var(--accent);stroke-width:1.5}
      .flow{fill:none;stroke:var(--ink);stroke-width:2;marker-end:url(#harbor-rollout-arrow)}.control{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#harbor-rollout-arrow-control)}.observe{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 5;marker-end:url(#harbor-rollout-arrow-control)}
      .mask{fill:var(--paper)}
    </style>
    <marker id="harbor-rollout-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--ink)"/></marker>
    <marker id="harbor-rollout-arrow-control" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--muted)"/></marker>
    <marker id="harbor-rollout-arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
  </defs>
<rect width="1280" height="912" fill="var(--paper)"/>
<text x="32" y="48" class="title" text-anchor="start">Harbor / Independent trials, traceable evidence</text>
<text x="32" y="84" class="body muted" text-anchor="start">89 tasks × 5 repetitions × 2 arms = 890 planned cells, not 890 valid completed trials.</text>
<rect x="32" y="292" width="584" height="184" rx="4" class="boundary"/><rect x="664" y="292" width="584" height="184" rx="4" class="boundary"/>
<path d="M640 240V264H324V292" class="flow"/><path d="M640 264H956V292" class="flow"/><path d="M340 400H384" class="flow"/><path d="M972 400H1016" class="flow"/><path d="M200 448V504H352V564" class="observe"/><path d="M832 448V504H352" class="observe" style="marker-end:none"/><path d="M488 448V528H688V564" class="observe"/><path d="M1120 448V528H688" class="observe" style="marker-end:none"/><path d="M792 620H856" class="flow"/><path d="M1052 676V708H412V744" class="flow"/><path d="M792 788H856" class="flow"/>
<rect x="32" y="144" width="1216" height="96" rx="4" class="focus"/><text x="52" y="180" class="name" text-anchor="start">Harbor / trial lifecycle</text><text x="52" y="212" class="body" text-anchor="start">Frozen run spec · separate environments · agent timeout · task-native verifier</text><text x="56" y="324" class="section" text-anchor="start">GEODE / independent trial container</text><text x="688" y="324" class="section" text-anchor="start">CODEX / independent trial container</text><rect x="56" y="348" width="284" height="100" rx="4" class="node"/><text x="76" y="384" class="name" text-anchor="start">AgenticLoop</text><text x="76" y="416" class="body" text-anchor="start">One terminal_exec tool</text><rect x="384" y="348" width="208" height="100" rx="4" class="node"/><text x="404" y="384" class="name" text-anchor="start">Task verifier</text><text x="404" y="416" class="body" text-anchor="start">Result · reward</text><rect x="688" y="348" width="284" height="100" rx="4" class="node"/><text x="708" y="384" class="name" text-anchor="start">Native Codex</text><text x="708" y="416" class="body" text-anchor="start">CLI execution</text><rect x="1016" y="348" width="208" height="100" rx="4" class="node"/><text x="1036" y="384" class="name" text-anchor="start">Task verifier</text><text x="1036" y="416" class="body" text-anchor="start">Result · reward</text><rect x="32" y="564" width="760" height="112" rx="4" class="node"/><text x="52" y="600" class="name" text-anchor="start">Private raw jobs / preserve original evidence</text><text x="52" y="632" class="body" text-anchor="start">config · result · trajectory · verifier outputs</text><text x="52" y="660" class="body" text-anchor="start">Original and supplemental attempts retain their lineage.</text><rect x="856" y="564" width="392" height="112" rx="4" class="node"/><text x="876" y="600" class="name" text-anchor="start">Publication checks</text><text x="876" y="632" class="body" text-anchor="start">Normalize · select by contract</text><text x="876" y="660" class="body" text-anchor="start">Schema · hashes · privacy</text><rect x="32" y="744" width="760" height="88" rx="4" class="node"/><text x="52" y="780" class="name" text-anchor="start">geode-eval-artifacts</text><text x="52" y="812" class="body" text-anchor="start">Append-only public derivatives + publication manifest</text><rect x="856" y="744" width="392" height="88" rx="4" class="node"/><text x="876" y="780" class="name" text-anchor="start">Replay / docs</text><text x="876" y="812" class="body" text-anchor="start">Derived views, not score authority</text>
<path d="M32 848H1248" stroke="var(--rule)"/>
<text x="32" y="884" class="small" text-anchor="start">Branches mean independent arms, not simultaneous execution. Score authority: task verifier + frozen selection rules.</text>
</svg>
