<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="928" viewBox="0 0 1280 928" role="img" aria-labelledby="experimental-admission-title experimental-admission-desc">
<title id="experimental-admission-title">Experimental Loop / A score gain is not enough</title>
<desc id="experimental-admission-desc">A frozen baseline/candidate comparison is evaluated. Invalid execution retains the baseline. Valid execution is rejected if its gain does not exceed uncertainty or a critical veto is present. Only KEEP adopts a next baseline. The ledger retains raw evidence and every outcome.</desc>
<defs>
    <style>
      :root{color-scheme:light dark;--paper:#fafbfc;--surface:#f0f2f5;--node:#fff;--ink:#1f2733;--muted:#515d6e;--rule:#bec6d0;--accent:#b84e23;--tint:#fff4ee}
      @media(prefers-color-scheme:dark){:root{--paper:#0d1117;--surface:#161c25;--node:#111821;--ink:#e6edf3;--muted:#a5b1c2;--rule:#465266;--accent:#f09c72;--tint:#281d19}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
      .title{font-size:32px;font-weight:700;letter-spacing:-.6px}.name{font-size:24px;font-weight:650;letter-spacing:-.3px}.body{font-size:20px}.small{font-size:16px;fill:var(--muted)}.muted{fill:var(--muted)}
      .mono{font:16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:var(--muted)}.section{font-size:16px;font-weight:650;fill:var(--muted)}
      .boundary{fill:none;stroke:var(--rule);stroke-width:1.5}.node{fill:var(--node);stroke:var(--rule);stroke-width:1.2}.zone{fill:var(--surface)}.focus{fill:var(--tint);stroke:var(--accent);stroke-width:1.5}
      .flow{fill:none;stroke:var(--ink);stroke-width:2;marker-end:url(#experimental-admission-arrow)}.control{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#experimental-admission-arrow-control)}.observe{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 5;marker-end:url(#experimental-admission-arrow-control)}
      .mask{fill:var(--paper)}
    </style>
    <marker id="experimental-admission-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--ink)"/></marker>
    <marker id="experimental-admission-arrow-control" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--muted)"/></marker>
    <marker id="experimental-admission-arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
  </defs>
<rect width="1280" height="928" fill="var(--paper)"/>
<text x="32" y="48" class="title" text-anchor="start">Experimental Loop / A score gain is not enough</text>
<text x="32" y="84" class="body muted" text-anchor="start">The Ratchet admits a candidate only after validity, uncertainty and veto checks.</text>

<path d="M156 236V288" class="flow"/><path d="M280 336H320" class="flow"/><path d="M528 336H624" class="flow"/><path d="M944 336H1056" class="flow"/><path d="M424 416V544" class="flow"/><path d="M784 432V544" class="flow"/><path d="M156 384V740" class="observe"/><path d="M424 644V740" class="observe"/><path d="M784 644V740" class="observe"/><path d="M1152 384V740" class="observe"/>
<rect x="32" y="148" width="1216" height="88" rx="4" class="node"/><text x="52" y="184" class="name" text-anchor="start">Frozen Baseline + candidate</text><text x="52" y="216" class="body" text-anchor="start">Content-bound task pack · evaluator / harness identity · budget · paired comparison rule</text><rect x="32" y="288" width="248" height="96" rx="4" class="node"/><text x="52" y="324" class="name" text-anchor="start">Evaluation</text><text x="52" y="356" class="body" text-anchor="start">Revision-bound run</text><path d="M424 256 528 336 424 416 320 336Z" class="node"/><text x="424" y="330.0" class="body" text-anchor="middle">Valid</text><text x="424" y="358.0" class="body" text-anchor="middle">execution?</text><path d="M784 240 944 336 784 432 624 336Z" class="node"/><text x="784" y="316.0" class="body" text-anchor="middle">Gain beyond</text><text x="784" y="344.0" class="body" text-anchor="middle">uncertainty and</text><text x="784" y="372.0" class="body" text-anchor="middle">no critical veto?</text><rect x="1056" y="288" width="192" height="96" rx="4" class="focus"/><text x="1076" y="324" class="name" text-anchor="start">KEEP</text><text x="1076" y="356" class="body" text-anchor="start">Next Baseline</text><rect x="312" y="544" width="224" height="100" rx="4" class="node"/><text x="332" y="580" class="name" text-anchor="start">INVALID</text><text x="332" y="612" class="body" text-anchor="start">Baseline unchanged</text><rect x="624" y="544" width="320" height="100" rx="4" class="node"/><text x="644" y="580" class="name" text-anchor="start">REJECT</text><text x="644" y="612" class="body" text-anchor="start">Baseline unchanged</text><rect x="32" y="740" width="1216" height="104" rx="4" class="node"/><text x="52" y="776" class="name" text-anchor="start">Ledger / every attempt and verdict</text><text x="52" y="808" class="body" text-anchor="start">Revision · raw evidence · lineage · validity · selection reason</text><rect x="548" y="304" width="56" height="28" rx="4" class="mask"/><text x="576" y="324" class="small" text-anchor="middle">yes</text><rect x="972" y="304" width="56" height="28" rx="4" class="mask"/><text x="1000" y="324" class="small" text-anchor="middle">yes</text><rect x="400" y="464" width="48" height="28" rx="4" class="mask"/><text x="424" y="484" class="small" text-anchor="middle">no</text><rect x="760" y="464" width="48" height="28" rx="4" class="mask"/><text x="784" y="484" class="small" text-anchor="middle">no</text><rect x="88" y="640" width="136" height="28" rx="4" class="mask"/><text x="156" y="660" class="small" text-anchor="middle">raw evidence</text>
<path d="M32 864H1248" stroke="var(--rule)"/>
<text x="32" y="900" class="small" text-anchor="start">KEEP is an experiment verdict, not PR merge, deployment approval or evidence of sustained self-improvement.</text>
</svg>
