<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="geode-ci-ratchet-title geode-ci-ratchet-desc">
<title id="geode-ci-ratchet-title">GEODE / A passing check is not merge authority</title>
<desc id="geode-ci-ratchet-desc">Developer scope and shared instructions guide a worktree change with regression tests. CI failure returns evidence to the coding agent. A passing revision still needs current head/base checks and authorized review before develop and main promotion.</desc>
<defs>
    <style>
      :root{color-scheme:light dark;--paper:#fafbfc;--surface:#f0f2f5;--node:#fff;--ink:#1f2733;--muted:#515d6e;--rule:#bec6d0;--accent:#b84e23;--tint:#fff4ee}
      @media(prefers-color-scheme:dark){:root{--paper:#0d1117;--surface:#161c25;--node:#111821;--ink:#e6edf3;--muted:#a5b1c2;--rule:#465266;--accent:#f09c72;--tint:#281d19}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
      .title{font-size:32px;font-weight:700;letter-spacing:-.6px}.name{font-size:24px;font-weight:650;letter-spacing:-.3px}.body{font-size:20px}.small{font-size:16px;fill:var(--muted)}.muted{fill:var(--muted)}
      .mono{font:16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:var(--muted)}.section{font-size:16px;font-weight:650;fill:var(--muted)}
      .boundary{fill:none;stroke:var(--rule);stroke-width:1.5}.node{fill:var(--node);stroke:var(--rule);stroke-width:1.2}.zone{fill:var(--surface)}.focus{fill:var(--tint);stroke:var(--accent);stroke-width:1.5}
      .flow{fill:none;stroke:var(--ink);stroke-width:2;marker-end:url(#geode-ci-ratchet-arrow)}.control{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#geode-ci-ratchet-arrow-control)}.observe{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 5;marker-end:url(#geode-ci-ratchet-arrow-control)}
      .mask{fill:var(--paper)}
    </style>
    <marker id="geode-ci-ratchet-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--ink)"/></marker>
    <marker id="geode-ci-ratchet-arrow-control" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--muted)"/></marker>
    <marker id="geode-ci-ratchet-arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
  </defs>
<rect width="1280" height="800" fill="var(--paper)"/>
<text x="32" y="48" class="title" text-anchor="start">GEODE / A passing check is not merge authority</text>
<text x="32" y="84" class="body muted" text-anchor="start">Regression checks constrain the change; admission binds it to the current PR and approval.</text>

<path d="M336 268V308H172V364" class="flow"/><path d="M640 212H1112V364" class="control"/><path d="M312 424H360" class="flow"/><path d="M640 424H680" class="flow"/><path d="M904 424H976" class="flow"/><path d="M792 508V556H172V484" class="control"/><path d="M1112 484V604" class="flow"/>
<rect x="32" y="160" width="608" height="108" rx="4" class="node"/><text x="52" y="196" class="name" text-anchor="start">Developer scope + build scaffold</text><text x="52" y="228" class="body" text-anchor="start">Acceptance · AGENTS.md · CLAUDE.md · Skills</text><rect x="32" y="364" width="280" height="120" rx="4" class="node"/><text x="52" y="400" class="name" text-anchor="start">Coding agent</text><text x="52" y="432" class="body" text-anchor="start">Source / GAP audit</text><text x="52" y="460" class="body" text-anchor="start">Isolated worktree</text><rect x="360" y="364" width="280" height="120" rx="4" class="node"/><text x="380" y="400" class="name" text-anchor="start">Reviewed change</text><text x="380" y="432" class="body" text-anchor="start">Code + regression test</text><text x="380" y="460" class="body" text-anchor="start">Docs + CHANGELOG</text><path d="M792 340 904 424 792 508 680 424Z" class="node"/><text x="792" y="418.0" class="body" text-anchor="middle">CI ratchet</text><text x="792" y="446.0" class="body" text-anchor="middle">Checks pass?</text><rect x="976" y="364" width="272" height="120" rx="4" class="focus"/><text x="996" y="400" class="name" text-anchor="start">Merge admission</text><text x="996" y="432" class="body" text-anchor="start">Current head / base</text><text x="996" y="460" class="body" text-anchor="start">Checks + authority</text><rect x="976" y="604" width="272" height="96" rx="4" class="node"/><text x="996" y="640" class="name" text-anchor="start">develop → main</text><text x="996" y="672" class="body" text-anchor="start">Recheck CI + approval</text><rect x="916" y="392" width="56" height="28" rx="4" class="mask"/><text x="944" y="412" class="small" text-anchor="middle">pass</text><rect x="276" y="536" width="320" height="28" rx="4" class="mask"/><text x="436" y="556" class="small" text-anchor="middle">fail → diagnose, correct, recheck</text><rect x="1016" y="284" width="192" height="28" rx="4" class="mask"/><text x="1112" y="304" class="small" text-anchor="middle">review authority</text><text x="32" y="644" class="section" text-anchor="start">What is pinned</text><text x="32" y="680" class="body" text-anchor="start">Behavior, dependencies, prompts and evaluation contracts.</text><text x="32" y="712" class="small" text-anchor="start">The same revision must satisfy the required checks.</text>
<path d="M32 736H1248" stroke="var(--rule)"/>
<text x="32" y="772" class="small" text-anchor="start">CI ratchet: code and contract invariants. Experimental KEEP: a candidate verdict. Neither grants release permission.</text>
</svg>
