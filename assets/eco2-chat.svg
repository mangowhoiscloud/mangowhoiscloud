<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="936" viewBox="0 0 1280 936" role="img" aria-labelledby="eco2-chat-title eco2-chat-desc">
<title id="eco2-chat-title">Eco² / Select the work, then join its results</title>
<desc id="eco2-chat-desc">Chat uses a TaskIQ worker running LangGraph. Intent and optional Vision guide Send dispatch into selected domain, API/tool or image-generation nodes. The aggregator checks required context before optional compaction and streamed answering. Eval is configuration-dependent and bounded. Checkpoints and stored messages have separate persistence paths.</desc>
<defs>
    <style>
      :root{color-scheme:light dark;--paper:#fafbfc;--surface:#f0f2f5;--node:#fff;--ink:#1f2733;--muted:#515d6e;--rule:#bec6d0;--accent:#b84e23;--tint:#fff4ee}
      @media(prefers-color-scheme:dark){:root{--paper:#0d1117;--surface:#161c25;--node:#111821;--ink:#e6edf3;--muted:#a5b1c2;--rule:#465266;--accent:#f09c72;--tint:#281d19}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
      .title{font-size:32px;font-weight:700;letter-spacing:-.6px}.name{font-size:24px;font-weight:650;letter-spacing:-.3px}.body{font-size:20px}.small{font-size:16px;fill:var(--muted)}.muted{fill:var(--muted)}
      .mono{font:16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:var(--muted)}.section{font-size:16px;font-weight:650;fill:var(--muted)}
      .boundary{fill:none;stroke:var(--rule);stroke-width:1.5}.node{fill:var(--node);stroke:var(--rule);stroke-width:1.2}.zone{fill:var(--surface)}.focus{fill:var(--tint);stroke:var(--accent);stroke-width:1.5}
      .flow{fill:none;stroke:var(--ink);stroke-width:2;marker-end:url(#eco2-chat-arrow)}.control{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#eco2-chat-arrow-control)}.observe{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 5;marker-end:url(#eco2-chat-arrow-control)}
      .mask{fill:var(--paper)}
    </style>
    <marker id="eco2-chat-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--ink)"/></marker>
    <marker id="eco2-chat-arrow-control" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--muted)"/></marker>
    <marker id="eco2-chat-arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
  </defs>
<rect width="1280" height="936" fill="var(--paper)"/>
<text x="32" y="48" class="title" text-anchor="start">Eco² / Select the work, then join its results</text>
<text x="32" y="84" class="body muted" text-anchor="start">Intent and request context determine the active branches, not a fixed broadcast to every node.</text>

<path d="M288 268H328" class="flow"/><path d="M536 268H568V196H608" class="flow"/><path d="M568 268V324H608" class="flow"/><path d="M568 324V452H608" class="flow"/><path d="M944 196H972V452H944" class="flow" style="marker-end:none"/><path d="M944 324H972" class="flow" style="marker-end:none"/><path d="M972 336H1000" class="flow"/><path d="M1124 400V576" class="flow"/><path d="M1000 632H944" class="control"/>
<text x="32" y="144" class="section" text-anchor="start">Chat API → RabbitMQ → TaskIQ worker / LangGraph</text><rect x="32" y="212" width="256" height="112" rx="4" class="node"/><text x="52" y="248" class="name" text-anchor="start">Intent classifier</text><text x="52" y="280" class="body" text-anchor="start">Optional Vision</text><path d="M432 200 536 268 432 336 328 268Z" class="node"/><text x="432" y="262.0" class="body" text-anchor="middle">Router</text><text x="432" y="290.0" class="body" text-anchor="middle">Send</text><rect x="608" y="152" width="336" height="88" rx="4" class="node"/><text x="628" y="188" class="name" text-anchor="start">Domain nodes</text><text x="628" y="220" class="body" text-anchor="start">Waste RAG · character</text><rect x="608" y="280" width="336" height="88" rx="4" class="node"/><text x="628" y="316" class="name" text-anchor="start">API / tool nodes</text><text x="628" y="348" class="body" text-anchor="start">Location · weather · search</text><rect x="608" y="408" width="336" height="88" rx="4" class="node"/><text x="628" y="444" class="name" text-anchor="start">Image generation</text><text x="628" y="476" class="body" text-anchor="start">Separate selected branch</text><rect x="1000" y="268" width="248" height="132" rx="4" class="focus"/><text x="1020" y="304" class="name" text-anchor="start">Join + prepare</text><text x="1020" y="336" class="body" text-anchor="start">Aggregator</text><text x="1020" y="364" class="body" text-anchor="start">Optional compaction</text><rect x="1000" y="576" width="248" height="112" rx="4" class="node"/><text x="1020" y="612" class="name" text-anchor="start">Answer</text><text x="1020" y="644" class="body" text-anchor="start">Token events</text><text x="1020" y="672" class="body" text-anchor="start">To Event Router / SSE</text><rect x="608" y="576" width="336" height="112" rx="4" class="node"/><text x="628" y="612" class="name" text-anchor="start">Optional Eval</text><text x="628" y="644" class="body" text-anchor="start">Grading</text><text x="628" y="672" class="body" text-anchor="start">Bounded regeneration</text><text x="32" y="420" class="section" text-anchor="start">Choose, do not broadcast</text><text x="32" y="456" class="body" text-anchor="start">One or more branches run.</text><text x="32" y="492" class="body" text-anchor="start">The join checks required context.</text><text x="32" y="544" class="small" text-anchor="start">Structured / function calls select arguments;</text><text x="32" y="568" class="small" text-anchor="start">application commands perform the work.</text><rect x="884" y="536" width="176" height="28" rx="4" class="mask"/><text x="972" y="556" class="small" text-anchor="middle">when configured</text><rect x="32" y="748" width="1216" height="100" rx="4" class="zone"/><text x="52" y="780" class="section" text-anchor="start">CONVERSATION STATE</text><text x="52" y="816" class="body" text-anchor="start">Redis checkpoint → asynchronous syncer → PostgreSQL; message persistence uses a separate consumer.</text>
<path d="M32 872H1248" stroke="var(--rule)"/>
<text x="32" y="908" class="small" text-anchor="start">Only selected branches execute. Optional Eval is not unlimited retry or an unrestricted multi-agent ReAct loop.</text>
</svg>
