<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="816" viewBox="0 0 1280 816" role="img" aria-labelledby="eco2-build-title eco2-build-desc">
<title id="eco2-build-title">Eco² / From a reviewed change to a rollout</title>
<desc id="eco2-build-desc">Developer scope and project scaffolding guide Claude Code changes. CI checks changed services. Eligible builds publish images and update Git image tags; ArgoCD applies manifests and the cluster pulls images. Failure evidence returns to the coding agent, not an autonomous CI code-editing mechanism.</desc>
<defs>
    <style>
      :root{color-scheme:light dark;--paper:#fafbfc;--surface:#f0f2f5;--node:#fff;--ink:#1f2733;--muted:#515d6e;--rule:#bec6d0;--accent:#b84e23;--tint:#fff4ee}
      @media(prefers-color-scheme:dark){:root{--paper:#0d1117;--surface:#161c25;--node:#111821;--ink:#e6edf3;--muted:#a5b1c2;--rule:#465266;--accent:#f09c72;--tint:#281d19}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
      .title{font-size:32px;font-weight:700;letter-spacing:-.6px}.name{font-size:24px;font-weight:650;letter-spacing:-.3px}.body{font-size:20px}.small{font-size:16px;fill:var(--muted)}.muted{fill:var(--muted)}
      .mono{font:16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:var(--muted)}.section{font-size:16px;font-weight:650;fill:var(--muted)}
      .boundary{fill:none;stroke:var(--rule);stroke-width:1.5}.node{fill:var(--node);stroke:var(--rule);stroke-width:1.2}.zone{fill:var(--surface)}.focus{fill:var(--tint);stroke:var(--accent);stroke-width:1.5}
      .flow{fill:none;stroke:var(--ink);stroke-width:2;marker-end:url(#eco2-build-arrow)}.control{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#eco2-build-arrow-control)}.observe{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 5;marker-end:url(#eco2-build-arrow-control)}
      .mask{fill:var(--paper)}
    </style>
    <marker id="eco2-build-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--ink)"/></marker>
    <marker id="eco2-build-arrow-control" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--muted)"/></marker>
    <marker id="eco2-build-arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
  </defs>
<rect width="1280" height="816" fill="var(--paper)"/>
<text x="32" y="48" class="title" text-anchor="start">Eco² / From a reviewed change to a rollout</text>
<text x="32" y="84" class="body muted" text-anchor="start">Coding-agent work, CI checks and ArgoCD reconciliation have different owners.</text>

<path d="M352 216H416" class="flow"/><path d="M720 216H784" class="flow"/><path d="M1016 268V348" class="flow"/><path d="M784 408H568V268" class="control"/><path d="M896 456V504H160V572" class="flow"/><path d="M1120 456V528H496V572" class="flow"/><path d="M640 624H696" class="flow"/><path d="M928 624H984" class="flow"/><path d="M160 676V728H1116V676" class="control"/>
<rect x="32" y="160" width="320" height="108" rx="4" class="node"/><text x="52" y="196" class="name" text-anchor="start">Developer + scaffold</text><text x="52" y="228" class="body" text-anchor="start">Scope · review · Skills</text><text x="52" y="256" class="body" text-anchor="start">CLAUDE.md · SDK checks</text><rect x="416" y="160" width="304" height="108" rx="4" class="node"/><text x="436" y="196" class="name" text-anchor="start">Claude Code</text><text x="436" y="228" class="body" text-anchor="start">Development-side agent</text><rect x="784" y="160" width="464" height="108" rx="4" class="node"/><text x="804" y="196" class="name" text-anchor="start">Code + manifests</text><text x="804" y="228" class="body" text-anchor="start">apps/ · workloads/</text><rect x="784" y="348" width="464" height="108" rx="4" class="focus"/><text x="804" y="384" class="name" text-anchor="start">GitHub Actions</text><text x="804" y="416" class="body" text-anchor="start">Changed-service format · lint · tests</text><rect x="32" y="572" width="256" height="104" rx="4" class="node"/><text x="52" y="608" class="name" text-anchor="start">Container image</text><text x="52" y="640" class="body" text-anchor="start">Docker Hub</text><rect x="348" y="572" width="292" height="104" rx="4" class="node"/><text x="368" y="608" class="name" text-anchor="start">Git manifests</text><text x="368" y="640" class="body" text-anchor="start">Versioned image tag</text><rect x="696" y="572" width="232" height="104" rx="4" class="node"/><text x="716" y="608" class="name" text-anchor="start">ArgoCD</text><text x="716" y="640" class="body" text-anchor="start">ApplicationSet</text><rect x="984" y="572" width="264" height="104" rx="4" class="node"/><text x="1004" y="608" class="name" text-anchor="start">Cluster rollout</text><text x="1004" y="640" class="body" text-anchor="start">Desired state</text><rect x="500" y="388" width="264" height="28" rx="4" class="mask"/><text x="632" y="408" class="small" text-anchor="middle">failure evidence → correction</text><rect x="88" y="528" width="144" height="28" rx="4" class="mask"/><text x="160" y="548" class="small" text-anchor="middle">build / push</text><rect x="404" y="540" width="184" height="28" rx="4" class="mask"/><text x="496" y="560" class="small" text-anchor="middle">update image tag</text><rect x="552" y="708" width="160" height="28" rx="4" class="mask"/><text x="632" y="728" class="small" text-anchor="middle">image pull</text><text x="32" y="356" class="section" text-anchor="start">Different responsibilities</text><text x="32" y="392" class="body" text-anchor="start">Developer: scope and code review.</text><text x="32" y="428" class="body" text-anchor="start">CI: quality checks; ArgoCD: reconcile Git.</text><text x="32" y="480" class="small" text-anchor="start">Image publication requires an eligible push / manual build.</text>
<path d="M32 752H1248" stroke="var(--rule)"/>
<text x="32" y="788" class="small" text-anchor="start">This is an artifact and responsibility map, not a mandatory sequence for every change or proof of universal CI coverage.</text>
</svg>
