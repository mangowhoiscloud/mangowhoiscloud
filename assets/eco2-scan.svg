<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="776" viewBox="0 0 1280 776" role="img" aria-labelledby="eco2-scan-title eco2-scan-desc">
<title id="eco2-scan-title">Eco² / The job outlives its SSE connection</title>
<desc id="eco2-scan-desc">The Scan API registers a Celery chain and returns 202 plus a job ID. RabbitMQ queues connect Vision, Rule, Answer and character Reward stages. Every stage emits Redis Stream events. Event Router publishes to Pub/Sub and SSE independently of worker execution. ACK-on-success preserves pending entries for recovery.</desc>
<defs>
    <style>
      :root{color-scheme:light dark;--paper:#fafbfc;--surface:#f0f2f5;--node:#fff;--ink:#1f2733;--muted:#515d6e;--rule:#bec6d0;--accent:#b84e23;--tint:#fff4ee}
      @media(prefers-color-scheme:dark){:root{--paper:#0d1117;--surface:#161c25;--node:#111821;--ink:#e6edf3;--muted:#a5b1c2;--rule:#465266;--accent:#f09c72;--tint:#281d19}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
      .title{font-size:32px;font-weight:700;letter-spacing:-.6px}.name{font-size:24px;font-weight:650;letter-spacing:-.3px}.body{font-size:20px}.small{font-size:16px;fill:var(--muted)}.muted{fill:var(--muted)}
      .mono{font:16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:var(--muted)}.section{font-size:16px;font-weight:650;fill:var(--muted)}
      .boundary{fill:none;stroke:var(--rule);stroke-width:1.5}.node{fill:var(--node);stroke:var(--rule);stroke-width:1.2}.zone{fill:var(--surface)}.focus{fill:var(--tint);stroke:var(--accent);stroke-width:1.5}
      .flow{fill:none;stroke:var(--ink);stroke-width:2;marker-end:url(#eco2-scan-arrow)}.control{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#eco2-scan-arrow-control)}.observe{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 5;marker-end:url(#eco2-scan-arrow-control)}
      .mask{fill:var(--paper)}
    </style>
    <marker id="eco2-scan-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--ink)"/></marker>
    <marker id="eco2-scan-arrow-control" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--muted)"/></marker>
    <marker id="eco2-scan-arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
  </defs>
<rect width="1280" height="776" fill="var(--paper)"/>
<text x="32" y="48" class="title" text-anchor="start">Eco² / The job outlives its SSE connection</text>
<text x="32" y="84" class="body muted" text-anchor="start">Task queues move work; a separate event path reports how that work is progressing.</text>
<rect x="328" y="152" width="920" height="224" rx="4" class="boundary"/>
<path d="M280 276H352" class="flow"/><path d="M544 276H584" class="flow"/><path d="M776 276H816" class="flow"/><path d="M1008 276H1048" class="flow"/><path d="M448 336V416H172V500" class="observe"/><path d="M680 336V416H448" class="observe" style="marker-end:none"/><path d="M912 336V416H680" class="observe" style="marker-end:none"/><path d="M1136 336V416H912" class="observe" style="marker-end:none"/><path d="M312 556H368" class="flow"/><path d="M648 556H704" class="flow"/><path d="M984 556H1040" class="flow"/>
<text x="32" y="188" class="section" text-anchor="start">REQUEST / ACCEPT</text><rect x="32" y="216" width="248" height="120" rx="4" class="node"/><text x="52" y="252" class="name" text-anchor="start">Scan API</text><text x="52" y="284" class="body" text-anchor="start">Register chain</text><text x="52" y="312" class="body" text-anchor="start">202 + job_id</text><text x="352" y="188" class="section" text-anchor="start">TASK EXECUTION / RabbitMQ · Celery chain</text><rect x="352" y="216" width="192" height="120" rx="4" class="node"/><text x="372" y="252" class="name" text-anchor="start">Vision</text><text x="372" y="284" class="body" text-anchor="start">Image</text><text x="372" y="312" class="body" text-anchor="start">classification</text><rect x="584" y="216" width="192" height="120" rx="4" class="node"/><text x="604" y="252" class="name" text-anchor="start">Rule</text><text x="604" y="284" class="body" text-anchor="start">Regulations</text><text x="604" y="312" class="body" text-anchor="start">Lite RAG</text><rect x="816" y="216" width="192" height="120" rx="4" class="node"/><text x="836" y="252" class="name" text-anchor="start">Answer</text><text x="836" y="284" class="body" text-anchor="start">Disposal</text><text x="836" y="312" class="body" text-anchor="start">guidance</text><rect x="1048" y="216" width="176" height="120" rx="4" class="node"/><text x="1068" y="252" class="name" text-anchor="start">Reward</text><text x="1068" y="284" class="body" text-anchor="start">Character</text><text x="1068" y="312" class="body" text-anchor="start">grant / store</text><rect x="496" y="396" width="408" height="28" rx="4" class="mask"/><text x="700" y="416" class="small" text-anchor="middle">Each stage writes progress events with XADD</text><text x="32" y="468" class="section" text-anchor="start">PROGRESS DELIVERY / separate from the worker lifetime</text><rect x="32" y="500" width="280" height="112" rx="4" class="node"/><text x="52" y="536" class="name" text-anchor="start">Redis Streams</text><text x="52" y="568" class="body" text-anchor="start">Stage events</text><text x="52" y="596" class="body" text-anchor="start">Consumer group</text><rect x="368" y="500" width="280" height="112" rx="4" class="focus"/><text x="388" y="536" class="name" text-anchor="start">Event Router</text><text x="388" y="568" class="body" text-anchor="start">Process → publish</text><text x="388" y="596" class="body" text-anchor="start">ACK only on success</text><rect x="704" y="500" width="280" height="112" rx="4" class="node"/><text x="724" y="536" class="name" text-anchor="start">Pub/Sub → SSE</text><text x="724" y="568" class="body" text-anchor="start">Live delivery</text><text x="724" y="596" class="body" text-anchor="start">Separate connection</text><rect x="1040" y="500" width="208" height="112" rx="4" class="node"/><text x="1060" y="536" class="name" text-anchor="start">Client</text><text x="1060" y="568" class="body" text-anchor="start">Progress</text><text x="1060" y="596" class="body" text-anchor="start">Result</text><text x="32" y="656" class="section" text-anchor="start">Recovery</text><text x="160" y="656" class="body" text-anchor="start">Pending entries → reclaim. State KV + Streams → reconnect / catch-up.</text><text x="160" y="692" class="small" text-anchor="start">Pub/Sub is live transport, not the recovery log.</text>
<path d="M32 712H1248" stroke="var(--rule)"/>
<text x="32" y="748" class="small" text-anchor="start">Solid: work / delivery. Dotted: stage events. Reward grants service characters; it is not a benchmark score.</text>
</svg>
