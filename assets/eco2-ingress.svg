<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="768" viewBox="0 0 1280 768" role="img" aria-labelledby="ingress-title ingress-desc">
  <title id="ingress-title">Eco² ingress: ALB forwards traffic; Istio delegates authorization</title>
  <desc id="ingress-desc">Route 53 resolves the hostname but does not forward HTTP traffic. The client sends HTTPS to AWS ALB, outside Kubernetes but inside the VPC. ALB terminates TLS with ACM and uses instance targets to send HTTP through an EC2 NodePort Service to the Istio Gateway pod. The gateway applies VirtualService routing to domain API pods and separately calls ext-authz in the auth namespace over gRPC port 50051 for covered paths. Istiod configures Envoy through xDS; it is not a traffic hop. Calico VXLAN and kube-proxy provide the underlying network and Service path.</desc>
  <defs>
    <style>
      :root{color-scheme:light dark;--paper:#fafbfc;--surface:#f0f2f5;--node:#fff;--ink:#1f2733;--muted:#515d6e;--rule:#bec6d0;--accent:#b84e23;--tint:#fff4ee}
      @media(prefers-color-scheme:dark){:root{--paper:#0d1117;--surface:#161c25;--node:#111821;--ink:#e6edf3;--muted:#a5b1c2;--rule:#465266;--accent:#f09c72;--tint:#281d19}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}.title{font-size:32px;font-weight:700;letter-spacing:-.6px}.name{font-size:24px;font-weight:650;letter-spacing:-.3px}.body{font-size:20px}.small{font-size:16px;fill:var(--muted)}.muted{fill:var(--muted)}.mono{font:16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:var(--muted)}.section{font-size:16px;font-weight:650;fill:var(--muted)}
      .boundary{fill:none;stroke:var(--rule);stroke-width:1.5}.node{fill:var(--node);stroke:var(--rule);stroke-width:1.2}.zone{fill:var(--surface)}.focus{fill:var(--tint);stroke:var(--accent);stroke-width:1.5}.mask{fill:var(--paper)}
      .flow{fill:none;stroke:var(--ink);stroke-width:2;marker-end:url(#arrow)}.auth{fill:none;stroke:var(--accent);stroke-width:2;marker-end:url(#arrow-accent)}.control{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#arrow-control)}
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--ink)"/></marker>
    <marker id="arrow-control" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--muted)"/></marker>
    <marker id="arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
  </defs>
  <rect width="1280" height="768" fill="var(--paper)"/>
  <text x="32" y="48" class="title">Traffic crosses the gateway. Authorization branches off.</text>
  <text x="32" y="84" class="body muted">ALB handles the AWS entry point; Envoy enforces the route and authorization policy.</text>

  <rect x="264" y="144" width="984" height="504" rx="8" class="boundary"/>
  <rect x="280" y="132" width="96" height="24" class="mask"/><text x="292" y="152" class="section">AWS VPC</text>
  <rect x="536" y="192" width="680" height="424" rx="4" class="boundary"/>
  <rect x="552" y="180" width="288" height="24" class="mask"/><text x="564" y="200" class="section">Self-managed Kubernetes</text>

  <path d="M184 356H296" class="flow"/>
  <path d="M472 356H568" class="flow"/>
  <path d="M736 356H808" class="flow"/>
  <path d="M984 356H1056" class="flow"/>
  <path d="M896 408V488" class="auth"/>
  <path d="M896 284V304" class="control"/>
  <path d="M976 256H1120V304" class="control"/>

  <rect x="32" y="304" width="152" height="104" rx="4" class="node"/>
  <text x="48" y="344" class="name">Client</text>
  <text x="48" y="380" class="body">Web / app</text>
  <text x="32" y="232" class="body">Route 53 resolves</text>
  <text x="32" y="260" class="body">the ALB hostname.</text>

  <rect x="296" y="304" width="176" height="104" rx="4" class="node"/>
  <text x="312" y="344" class="name">ALB + ACM</text>
  <text x="312" y="380" class="body">TLS termination</text>
  <text x="296" y="448" class="mono">target-type:</text>
  <text x="296" y="472" class="mono">instance</text>

  <rect x="568" y="304" width="168" height="104" rx="4" class="node"/>
  <text x="584" y="344" class="name">NodePort</text>
  <text x="584" y="376" class="body">EC2 target</text>
  <text x="568" y="448" class="small">kube-proxy / Service</text>
  <text x="568" y="476" class="small">to the gateway Pod</text>

  <rect x="808" y="228" width="168" height="56" rx="4" class="zone"/>
  <text x="824" y="264" class="body" font-weight="650">Istiod / xDS</text>
  <rect x="808" y="304" width="176" height="104" rx="4" class="focus"/>
  <text x="824" y="344" class="name">Gateway</text>
  <text x="824" y="380" class="body">Envoy proxy</text>
  <rect x="1056" y="304" width="128" height="104" rx="4" class="node"/>
  <text x="1072" y="344" class="name">API Pod</text>
  <text x="1072" y="380" class="body">+ Envoy</text>

  <rect x="792" y="488" width="392" height="92" rx="4" class="focus"/>
  <text x="808" y="524" class="name">ext-authz</text>
  <text x="808" y="556" class="mono">namespace: auth</text>
  <text x="992" y="556" class="mono">domain=auth</text>

  <rect x="188" y="320" width="104" height="24" class="mask"/><text x="240" y="336" text-anchor="middle" class="mono">HTTPS :443</text>
  <rect x="488" y="320" width="64" height="24" class="mask"/><text x="520" y="336" text-anchor="middle" class="mono">HTTP</text>
  <rect x="880" y="432" width="136" height="24" class="mask"/><text x="896" y="448" class="mono" fill="var(--accent)">gRPC :50051</text>
  <text x="1024" y="448" class="small">Covered paths</text>

  <text x="32" y="548" class="body" font-weight="650">Routing configuration is not another proxy.</text>
  <text x="32" y="580" class="body muted">VirtualService and EnvoyFilter are applied at Envoy.</text>
  <text x="32" y="612" class="body muted">ext-authz returns a decision, not application traffic.</text>

  <path d="M32 684H1248" stroke="var(--rule)"/>
  <path d="M32 712H80" class="flow"/><text x="96" y="720" class="small">Request</text>
  <path d="M252 712H300" class="auth"/><text x="316" y="720" class="small">Auth check</text>
  <path d="M504 712H552" class="control"/><text x="568" y="720" class="small">Configuration</text>
  <text x="1248" y="720" text-anchor="end" class="small">Underlay: Calico VXLAN + kube-proxy</text>
  <text x="32" y="752" class="small">Response arrows omitted. Gateway Pod placement does not restrict ALB targets to that node.</text>
</svg>
