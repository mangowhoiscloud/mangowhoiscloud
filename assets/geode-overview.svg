<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="768" viewBox="0 0 1280 768" role="img" aria-labelledby="geode-overview-title geode-overview-desc">
<title id="geode-overview-title">GEODE / Build, execute, investigate</title>
<desc id="geode-overview-desc">Build instructions guide coding agents. Reviewed code changes reach GEODE&#x27;s context, loop and verification components. Execution observations feed experimental scaffold search; proposed candidates return for review. Experimental adoption, merge and release have separate authority.</desc>
<defs>
    <style>
      :root{color-scheme:light dark;--paper:#fafbfc;--surface:#f0f2f5;--node:#fff;--ink:#1f2733;--muted:#515d6e;--rule:#bec6d0;--accent:#b84e23;--tint:#fff4ee}
      @media(prefers-color-scheme:dark){:root{--paper:#0d1117;--surface:#161c25;--node:#111821;--ink:#e6edf3;--muted:#a5b1c2;--rule:#465266;--accent:#f09c72;--tint:#281d19}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
      .title{font-size:32px;font-weight:700;letter-spacing:-.6px}.name{font-size:24px;font-weight:650;letter-spacing:-.3px}.body{font-size:20px}.small{font-size:16px;fill:var(--muted)}.muted{fill:var(--muted)}
      .mono{font:16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:var(--muted)}.section{font-size:16px;font-weight:650;fill:var(--muted)}
      .boundary{fill:none;stroke:var(--rule);stroke-width:1.5}.node{fill:var(--node);stroke:var(--rule);stroke-width:1.2}.zone{fill:var(--surface)}.focus{fill:var(--tint);stroke:var(--accent);stroke-width:1.5}
      .flow{fill:none;stroke:var(--ink);stroke-width:2;marker-end:url(#geode-overview-arrow)}.control{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#geode-overview-arrow-control)}.observe{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 5;marker-end:url(#geode-overview-arrow-control)}
      .mask{fill:var(--paper)}
    </style>
    <marker id="geode-overview-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--ink)"/></marker>
    <marker id="geode-overview-arrow-control" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--muted)"/></marker>
    <marker id="geode-overview-arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
  </defs>
<rect width="1280" height="768" fill="var(--paper)"/>
<text x="32" y="48" class="title" text-anchor="start">GEODE / Build, execute, investigate</text>
<text x="32" y="84" class="body muted" text-anchor="start">The development harness changes the runtime; it does not control each live turn.</text>
<rect x="32" y="144" width="352" height="376" rx="4" class="boundary"/><rect x="424" y="144" width="824" height="376" rx="4" class="boundary"/>
<path d="M208 312V368" class="flow"/><path d="M640 268H688" class="flow"/><path d="M360 424H664V268H688" class="flow"/><path d="M952 252H1000" class="flow"/><path d="M1000 296H952" class="control"/><path d="M824 324V400" class="flow"/><path d="M816 488V588" class="flow"/><path d="M424 640H208V480" class="control"/>
<text x="56" y="176" class="section" text-anchor="start">META-HARNESS / BUILD</text><text x="448" y="176" class="section" text-anchor="start">GEODE / RUNTIME</text><rect x="56" y="200" width="304" height="112" rx="4" class="node"/><text x="76" y="236" class="name" text-anchor="start">Build Scaffold</text><text x="76" y="268" class="body" text-anchor="start">Instructions · Skills · CI</text><rect x="56" y="368" width="304" height="112" rx="4" class="node"/><text x="76" y="404" class="name" text-anchor="start">Coding agents</text><text x="76" y="436" class="body" text-anchor="start">Claude Code · Codex CLI</text><rect x="448" y="216" width="192" height="108" rx="4" class="node"/><text x="468" y="252" class="name" text-anchor="start">Context</text><text x="468" y="284" class="body" text-anchor="start">Control</text><rect x="688" y="216" width="264" height="108" rx="4" class="focus"/><text x="708" y="252" class="name" text-anchor="start">AgenticLoop</text><text x="708" y="284" class="body" text-anchor="start">Model · tools</text><rect x="1000" y="216" width="224" height="108" rx="4" class="node"/><text x="1020" y="252" class="name" text-anchor="start">Verify</text><text x="1020" y="284" class="body" text-anchor="start">Run contract</text><rect x="688" y="400" width="536" height="88" rx="4" class="node"/><text x="708" y="436" class="name" text-anchor="start">Observe</text><text x="708" y="468" class="body" text-anchor="start">Trajectory · usage · termination evidence</text><rect x="424" y="588" width="528" height="104" rx="4" class="node"/><text x="444" y="624" class="name" text-anchor="start">Experimental Loop</text><text x="444" y="656" class="body" text-anchor="start">Scaffold Search · candidate evaluation</text><rect x="384" y="384" width="256" height="28" rx="4" class="mask"/><text x="512" y="404" class="small" text-anchor="middle">reviewed runtime change</text><rect x="804" y="528" width="184" height="28" rx="4" class="mask"/><text x="896" y="548" class="small" text-anchor="middle">execution evidence</text><rect x="76" y="548" width="264" height="28" rx="4" class="mask"/><text x="208" y="568" class="small" text-anchor="middle">candidate proposed for review</text><text x="992" y="620" class="section" text-anchor="start">Separate authority</text><text x="992" y="652" class="body" text-anchor="start">PR merge / release</text><text x="992" y="680" class="small" text-anchor="start">remain operator-owned.</text>
<path d="M32 704H1248" stroke="var(--rule)"/>
<text x="32" y="740" class="small" text-anchor="start">Solid: execution or artifact handoff. Dashed: verdict / proposal. Scaffold experiments do not update model weights.</text>
</svg>
