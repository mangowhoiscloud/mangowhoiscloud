<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="856" viewBox="0 0 1280 856" role="img" aria-labelledby="eco2-observability-title eco2-observability-desc">
<title id="eco2-observability-title">Eco² / Read the record that matches the failure</title>
<desc id="eco2-observability-desc">APIs, workers and Envoy emit operational metrics, logs and request spans. Prometheus, Fluent Bit/Elasticsearch and OpenTelemetry/Jaeger serve different investigations. LangGraph&#x27;s configured LangSmith path records LLM-node execution. Collection paths do not establish complete trace coverage or an answer-quality verdict.</desc>
<defs>
    <style>
      :root{color-scheme:light dark;--paper:#fafbfc;--surface:#f0f2f5;--node:#fff;--ink:#1f2733;--muted:#515d6e;--rule:#bec6d0;--accent:#b84e23;--tint:#fff4ee}
      @media(prefers-color-scheme:dark){:root{--paper:#0d1117;--surface:#161c25;--node:#111821;--ink:#e6edf3;--muted:#a5b1c2;--rule:#465266;--accent:#f09c72;--tint:#281d19}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
      .title{font-size:32px;font-weight:700;letter-spacing:-.6px}.name{font-size:24px;font-weight:650;letter-spacing:-.3px}.body{font-size:20px}.small{font-size:16px;fill:var(--muted)}.muted{fill:var(--muted)}
      .mono{font:16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:var(--muted)}.section{font-size:16px;font-weight:650;fill:var(--muted)}
      .boundary{fill:none;stroke:var(--rule);stroke-width:1.5}.node{fill:var(--node);stroke:var(--rule);stroke-width:1.2}.zone{fill:var(--surface)}.focus{fill:var(--tint);stroke:var(--accent);stroke-width:1.5}
      .flow{fill:none;stroke:var(--ink);stroke-width:2;marker-end:url(#eco2-observability-arrow)}.control{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#eco2-observability-arrow-control)}.observe{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 5;marker-end:url(#eco2-observability-arrow-control)}
      .mask{fill:var(--paper)}
    </style>
    <marker id="eco2-observability-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--ink)"/></marker>
    <marker id="eco2-observability-arrow-control" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--muted)"/></marker>
    <marker id="eco2-observability-arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
  </defs>
<rect width="1280" height="856" fill="var(--paper)"/>
<text x="32" y="48" class="title" text-anchor="start">Eco² / Read the record that matches the failure</text>
<text x="32" y="84" class="body muted" text-anchor="start">A queue, a failed request and a slow model call leave different evidence.</text>
<rect x="32" y="204" width="248" height="384" rx="4" class="zone"/><rect x="32" y="624" width="248" height="104" rx="4" class="zone"/>
<path d="M280 256H360" class="observe"/><path d="M880 256H932" class="observe"/><path d="M280 396H360" class="observe"/><path d="M880 396H932" class="observe"/><path d="M280 536H360" class="observe"/><path d="M880 536H932" class="observe"/><path d="M280 676H360" class="observe"/><path d="M880 676H932" class="observe"/>
<text x="32" y="164" class="section" text-anchor="start">PRODUCER</text><text x="360" y="164" class="section" text-anchor="start">COLLECT / RETAIN / QUERY</text><text x="948" y="164" class="section" text-anchor="start">INVESTIGATION</text><text x="52" y="248" class="name" text-anchor="start">API / workers</text><text x="52" y="284" class="name" text-anchor="start">Envoy</text><text x="52" y="356" class="body" text-anchor="start">Metrics</text><text x="52" y="392" class="body" text-anchor="start">stdout / stderr</text><text x="52" y="428" class="body" text-anchor="start">Request spans</text><text x="52" y="664" class="name" text-anchor="start">Chat LangGraph</text><text x="52" y="700" class="body" text-anchor="start">LLM / tool calls</text><rect x="360" y="204" width="520" height="104" rx="4" class="node"/><text x="380" y="240" class="name" text-anchor="start">Prometheus → Grafana</text><text x="380" y="272" class="body" text-anchor="start">Alertmanager · Kiali / mesh topology</text><rect x="360" y="344" width="520" height="104" rx="4" class="node"/><text x="380" y="380" class="name" text-anchor="start">Fluent Bit → Elasticsearch</text><text x="380" y="412" class="body" text-anchor="start">Kibana / structured log search</text><rect x="360" y="484" width="520" height="104" rx="4" class="node"/><text x="380" y="520" class="name" text-anchor="start">OpenTelemetry → Jaeger</text><text x="380" y="552" class="body" text-anchor="start">Request spans / sampled traces</text><rect x="360" y="624" width="520" height="104" rx="4" class="node"/><text x="380" y="660" class="name" text-anchor="start">LangSmith</text><text x="380" y="692" class="body" text-anchor="start">Node timing · token usage · errors</text><text x="948" y="244" class="name" text-anchor="start">Queue / Pod pressure</text><text x="948" y="280" class="body" text-anchor="start">Backlog versus capacity</text><text x="948" y="384" class="name" text-anchor="start">Failure context</text><text x="948" y="420" class="body" text-anchor="start">Search the failing event</text><text x="948" y="524" class="name" text-anchor="start">Request path</text><text x="948" y="560" class="body" text-anchor="start">Locate a slow / failed span</text><text x="948" y="664" class="name" text-anchor="start">LLM-node execution</text><text x="948" y="700" class="body" text-anchor="start">Model or tool wait?</text><text x="32" y="772" class="small" text-anchor="start">Istio sampling: 50%. LangSmith and LangGraph → OTel require tracing configuration.</text>
<path d="M32 792H1248" stroke="var(--rule)"/>
<text x="32" y="828" class="small" text-anchor="start">Dotted: observation path. These are collection responsibilities, not a claim that every request retained a trace.</text>
</svg>
