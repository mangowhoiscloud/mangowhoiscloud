<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="944" viewBox="0 0 1280 944" role="img" aria-labelledby="cluster-title cluster-desc">
  <title id="cluster-title">Eco² Kubernetes architecture: control, execution and delivery boundaries</title>
  <desc id="cluster-desc">A source-grounded view of a closed service. AWS ALB is outside self-managed Kubernetes. Inside the cluster, Kubernetes control-plane components and platform controllers are separate from the application data plane. Istio Gateway routes to domain APIs. RabbitMQ queues feed AI and storage workers; Redis Streams, Event Router, Pub/Sub and SSE Gateway form a separate progress-delivery path. PostgreSQL and purpose-specific Redis provide state. Metrics, traces and logs use a separate observation path. Boxes represent responsibilities, not individual machines, namespaces or security guarantees.</desc>
  <defs>
    <style>
      :root{color-scheme:light dark;--paper:#fafbfc;--surface:#f0f2f5;--node:#fff;--ink:#1f2733;--muted:#515d6e;--rule:#bec6d0;--accent:#b84e23;--tint:#fff4ee}
      @media(prefers-color-scheme:dark){:root{--paper:#0d1117;--surface:#161c25;--node:#111821;--ink:#e6edf3;--muted:#a5b1c2;--rule:#465266;--accent:#f09c72;--tint:#281d19}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
      .title{font-size:32px;font-weight:700;letter-spacing:-.6px}.name{font-size:24px;font-weight:650;letter-spacing:-.3px}.body{font-size:20px}.small{font-size:16px;fill:var(--muted)}.muted{fill:var(--muted)}
      .mono{font:16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:var(--muted)}.section{font-size:16px;font-weight:650;fill:var(--muted)}
      .boundary{fill:none;stroke:var(--rule);stroke-width:1.5}.node{fill:var(--node);stroke:var(--rule);stroke-width:1.2}.zone{fill:var(--surface)}.focus{fill:var(--tint);stroke:var(--accent);stroke-width:1.5}
      .flow{fill:none;stroke:var(--ink);stroke-width:2;marker-end:url(#arrow)}.control{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#arrow-control)}.observe{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 5;marker-end:url(#arrow-control)}
      .mask{fill:var(--paper)}
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--ink)"/></marker>
    <marker id="arrow-control" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--muted)"/></marker>
    <marker id="arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--accent)"/></marker>
  </defs>
  <rect width="1280" height="944" fill="var(--paper)"/>
  <text x="32" y="48" class="title">Eco² / Kubernetes architecture</text>
  <text x="32" y="84" class="body muted">Request handling, task execution and progress delivery have separate lifetimes.</text>

  <!-- Boundary first. Functional groups do not claim one-node or one-namespace placement. -->
  <rect x="248" y="136" width="1000" height="704" rx="8" class="boundary"/>
  <rect x="268" y="124" width="296" height="28" class="mask"/>
  <text x="280" y="144" class="section">Self-managed Kubernetes</text>
  <rect x="280" y="184" width="320" height="120" rx="4" class="zone"/>
  <rect x="624" y="184" width="592" height="120" rx="4" class="zone"/>
  <rect x="1008" y="360" width="208" height="444" rx="4" class="zone"/>

  <!-- Only the principal runtime relationships are shown. -->
  <path d="M200 416H280" class="flow"/>
  <path d="M504 416H560" class="flow"/>
  <path d="M624 476V508H444V536" class="flow"/>
  <path d="M608 596H652" class="flow"/>
  <path d="M444 664V720" class="flow"/>
  <path d="M896 416H952V764H896" class="flow"/>
  <path d="M784 304V360" class="control"/>
  <path d="M896 596H1008" class="observe"/>

  <rect x="32" y="360" width="168" height="116" rx="4" class="node"/>
  <text x="32" y="320" class="section">Outside Kubernetes</text>
  <text x="48" y="396" class="name">AWS ALB</text>
  <text x="48" y="428" class="body">ACM / TLS</text>
  <text x="48" y="456" class="mono">HTTPS :443</text>
  <text x="32" y="520" class="body">Route 53</text>
  <text x="32" y="548" class="small">DNS resolution</text>
  <text x="32" y="572" class="small">Not a traffic hop</text>

  <text x="296" y="220" class="name">Kubernetes control plane</text>
  <text x="296" y="252" class="body">API server / etcd</text>
  <text x="296" y="280" class="body">Scheduler / controller manager</text>
  <text x="640" y="220" class="name">Platform controllers</text>
  <text x="640" y="252" class="body">ArgoCD: deploy</text>
  <text x="904" y="252" class="body">Istiod: configure Envoy</text>
  <text x="640" y="280" class="body">ALB Controller / ExternalDNS / KEDA</text>

  <text x="280" y="336" class="section">Application data plane</text>
  <rect x="280" y="360" width="224" height="116" rx="4" class="focus"/>
  <text x="296" y="384" class="section">EDGE</text>
  <text x="296" y="416" class="name">Istio Gateway</text>
  <text x="296" y="448" class="body">Envoy / routing</text>
  <rect x="560" y="360" width="336" height="116" rx="4" class="node"/>
  <text x="576" y="384" class="section">SERVICE</text>
  <text x="576" y="416" class="name">Domain APIs + Envoy</text>
  <text x="576" y="448" class="body">auth / users / scan / chat / …</text>

  <rect x="280" y="536" width="328" height="128" rx="4" class="focus"/>
  <text x="296" y="560" class="section">INTEGRATION / EXECUTION</text>
  <text x="296" y="592" class="name">RabbitMQ → workers</text>
  <text x="296" y="624" class="body">AI: Scan / Chat</text>
  <text x="296" y="648" class="body">Storage: writes / checkpoints</text>
  <rect x="652" y="536" width="244" height="128" rx="4" class="node"/>
  <text x="668" y="560" class="section">INTEGRATION / DELIVERY</text>
  <text x="668" y="592" class="name">Progress events</text>
  <text x="668" y="624" class="body">Streams → Router</text>
  <text x="668" y="648" class="body">→ Pub/Sub → SSE</text>

  <rect x="280" y="720" width="616" height="84" rx="4" class="node"/>
  <text x="296" y="744" class="section">PERSISTENCE</text>
  <text x="296" y="776" class="name">PostgreSQL</text>
  <text x="508" y="776" class="name">Redis</text>
  <text x="596" y="776" class="small">auth / cache / Streams / Pub/Sub</text>

  <text x="1024" y="396" class="body" font-weight="650">Observability</text>
  <text x="1024" y="444" class="section">METRICS</text>
  <text x="1024" y="476" class="body">Prometheus</text>
  <text x="1024" y="504" class="body">Grafana</text>
  <text x="1024" y="556" class="section">TRACES / MESH</text>
  <text x="1024" y="588" class="body">OTel / Jaeger</text>
  <text x="1024" y="616" class="body">Kiali</text>
  <text x="1024" y="668" class="section">LOGS</text>
  <text x="1024" y="700" class="body">Fluent Bit</text>
  <text x="1024" y="728" class="body">Elasticsearch</text>
  <text x="1024" y="756" class="body">Kibana</text>

  <!-- Opaque label masks keep connection strokes away from text. -->
  <rect x="204" y="384" width="72" height="24" class="mask"/><text x="240" y="400" text-anchor="middle" class="small">NodePort</text>
  <rect x="668" y="316" width="232" height="24" class="mask"/><text x="784" y="332" text-anchor="middle" class="small">reconcile / configure / scale</text>
  <rect x="448" y="684" width="92" height="24" class="mask"/><text x="460" y="700" class="small">DB writes</text>
  <rect x="896" y="684" width="112" height="24" class="mask"/><text x="952" y="700" text-anchor="middle" class="small">read / write</text>
  <rect x="900" y="564" width="104" height="24" class="mask"/><text x="952" y="580" text-anchor="middle" class="small">telemetry</text>

  <path d="M32 872H1248" stroke="var(--rule)"/>
  <path d="M32 900H80" class="flow"/><text x="96" y="908" class="small">Request / work</text>
  <path d="M308 900H356" class="control"/><text x="372" y="908" class="small">Control</text>
  <path d="M524 900H572" class="observe"/><text x="588" y="908" class="small">Telemetry</text>
  <text x="1248" y="908" text-anchor="end" class="small">Functional groups, not a live node inventory.</text>
</svg>
